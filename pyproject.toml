[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detechum"
version = "0.0.1"
description = "Open source AI text detection with calibrated, explained and reproducible scores"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
models = ["torch", "transformers", "safetensors", "tokenizers"]

[tool.setuptools.packages.find]
where = ["src"]
